    <!-- INTEGRACIÓN DE FIREBASE PARA SINCRONIZACIÓN EN LA NUBE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2vERcbTTP8W5y_6r0rCjOfKztWRH4BJY",
            authDomain: "lubeltec.firebaseapp.com",
            projectId: "lubeltec",
            storageBucket: "lubeltec.firebasestorage.app",
            messagingSenderId: "739680228651",
            appId: "1:739680228651:web:1a1b9d0bc1bb018e96216e",
            measurementId: "G-KXSG58P6BV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const productsCol = collection(db, "products");
        onSnapshot(productsCol, (snapshot) => {
            if (!snapshot.empty) {
                let cloudProds = [];
                snapshot.forEach((docSnap) => {
                    cloudProds.push({ id: docSnap.id, ...docSnap.data() });
                });
                if (cloudProds.length > 0) {
                    products = cloudProds;
                    if (typeof window.renderCatalog === "function") {
                        window.renderCatalog();
                        window.updateProducts();
                        if (typeof window.renderAdminProductList === "function") {
                            window.renderAdminProductList();
                        }
                    }
                }
            } else {
                if (typeof window.seedInitialProducts === "function") {
                    window.seedInitialProducts();
                }
            }
        });

        const settingsDocRef = doc(db, "settings", "global_config");
        onSnapshot(settingsDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.globalTiers) globalTiers = data.globalTiers;
                if (data.discountsActive !== undefined) discountsActive = data.discountsActive;
                if (data.toastsActive !== undefined) toastsActive = data.toastsActive;
                if (data.holidayTheme) holidayTheme = data.holidayTheme;
                if (data.supportLimaActive !== undefined) supportLimaActive = data.supportLimaActive;
                if (data.supportTrujilloActive !== undefined) supportTrujilloActive = data.supportTrujilloActive;
                if (data.supportLimaAgents) supportLimaAgents = data.supportLimaAgents;
                if (data.supportTrujilloAgents) supportTrujilloAgents = data.supportTrujilloAgents;
                if (data.collabDiscountPct !== undefined) collabDiscountPct = data.collabDiscountPct;

                if (typeof window.updateDynamicBanner === "function") {
                    window.updateDynamicBanner();
                    window.checkSupportAvailability();
                    if (typeof window.renderAdminSupportAgents === "function") window.renderAdminSupportAgents();
                }
            }
        });

        window.saveProductToCloud = async function(productData) {
            const prodRef = doc(db, "products", productData.id);
            await setDoc(prodRef, productData, { merge: true });
        };

        window.deleteProductFromCloud = async function(productId) {
            const prodRef = doc(db, "products", productId);
            await deleteDoc(prodRef);
        };

        window.saveSettingsToCloud = async function(settingsData) {
            await setDoc(settingsDocRef, settingsData, { merge: true });
        };
    </script>
